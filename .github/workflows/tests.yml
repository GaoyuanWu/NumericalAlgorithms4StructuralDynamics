name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Versions
        run: python -c "import jax, numpy, scipy, Pynite; print('jax', jax.__version__, 'numpy', numpy.__version__, 'scipy', scipy.__version__)"
      - name: Run test suite (legacy parity, PyNite, SAP2000, SDOF, gradients)
        run: pytest -v --durations=10
      - name: Regenerate figures (smoke test)
        if: matrix.python-version == '3.12'
        run: python scripts/make_figures.py --quick
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: figures-quick
          path: docs/figures/
